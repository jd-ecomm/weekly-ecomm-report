<style>
:root{--bg:#0a0a0a;--panel:#141414;--panel-2:#0f0f0f;--border:#262626;--yellow:#FFE000;--yellow-dim:#fbbf24;--green:#4ade80;--red:#f87171;--blue:#60a5fa;--pink:#f472b6;--grey:#71717a;--grey-2:#a1a1aa;--text:#e4e4e7;--text-strong:#fff;}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.container{max-width:1480px;margin:0 auto;padding:24px 32px 64px}
.header{border-bottom:2px solid var(--yellow);padding-bottom:22px;margin-bottom:22px}
.header-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.brand-tag{display:inline-block;background:var(--yellow);color:#000;padding:4px 10px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;letter-spacing:.15em}
.report-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--grey);letter-spacing:.1em;text-transform:uppercase;margin-left:12px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:800;color:var(--text-strong);margin:6px 0 8px;letter-spacing:-.01em;line-height:1}
.subtitle{font-size:13px;color:var(--grey-2)}
.headline{text-align:right}.headline-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--grey);letter-spacing:.1em}
.headline-value{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:var(--yellow)}
.tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{background:transparent;color:var(--grey-2);border:none;border-bottom:2px solid transparent;padding:12px 20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;cursor:pointer;text-transform:uppercase;transition:all .15s}
.tab:hover{color:var(--text)}.tab.active{background:var(--panel);color:var(--yellow);border-bottom-color:var(--yellow)}
.tab-content{display:none}.tab-content.active{display:block}
.section-header{margin-top:36px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px}
.section-header-row{display:flex;align-items:baseline;gap:14px}
.section-num{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--yellow);font-weight:700;letter-spacing:.15em}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--text-strong);margin:0;text-transform:uppercase;letter-spacing:.02em}
.section-sub{font-size:13px;color:var(--grey-2);margin-top:6px;margin-left:38px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi-card{background:var(--panel);border:1px solid var(--border);padding:18px 18px 16px;border-radius:4px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--yellow)}
.kpi-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--grey-2);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;font-weight:600}
.kpi-value{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:var(--text-strong);letter-spacing:-.01em;line-height:1.1}
.kpi-deltas{display:flex;gap:14px;margin-top:10px;font-size:12px}
.kpi-target{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--grey);letter-spacing:.05em;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);text-transform:uppercase;min-height:14px}
.delta-label{color:var(--grey);text-transform:uppercase;letter-spacing:.06em;font-size:10px;margin-right:4px}
.delta{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.neutral{color:var(--grey)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:20px}
.panel-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text-strong);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-1-3-1{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.grid-1-5-1{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.stack{display:grid;grid-template-columns:1fr;gap:16px}
.chart-wrap{position:relative;width:100%}
.chart-wrap.h-240{height:240px}.chart-wrap.h-260{height:260px}.chart-wrap.h-280{height:280px}.chart-wrap.h-300{height:300px}.chart-wrap.h-320{height:320px}.chart-wrap.h-380{height:380px}.chart-wrap.h-420{height:420px}
.funnel-row{display:flex;gap:8px;flex-wrap:wrap}
.funnel-card{flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--border);padding:16px;border-radius:4px}
.funnel-card-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--grey-2);text-transform:uppercase;letter-spacing:.1em}
.funnel-card-val{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;color:var(--text-strong);margin:4px 0}
.funnel-card-sub{font-size:11px;color:var(--grey)}
.dropoff{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.dropoff-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--yellow);letter-spacing:.1em}
.dropoff-val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--text-strong)}
.dropoff-sub{font-size:11px;color:var(--grey)}
.compare-box{padding:18px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;border-left:3px solid}
.compare-box.pre{border-left-color:var(--blue)}.compare-box.post{border-left-color:var(--red)}.compare-box.now{border-left-color:var(--yellow)}
.compare-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--grey-2);letter-spacing:.1em;text-transform:uppercase}
.compare-value{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:var(--text-strong);margin-top:6px}
.compare-value.yellow{color:var(--yellow)}
.compare-sub{font-size:12px;color:var(--grey)}
.tbl{width:100%;border-collapse:collapse;font-family:'Barlow',sans-serif;font-size:12px}
.tbl thead tr{border-bottom:1px solid var(--border);color:var(--grey-2)}
.tbl th{padding:8px 12px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;font-weight:600;text-align:left;font-size:11px}
.tbl th.r,.tbl td.r{text-align:right}
.tbl tbody tr{border-bottom:1px solid var(--border)}
.tbl tbody tr:hover{background:rgba(255,224,0,.03)}
.tbl td{padding:10px 12px;color:var(--text)}
.tbl td.strong{color:var(--text-strong);font-weight:600}
.tbl td.muted{color:var(--grey-2)}
.tbl td.rank{color:var(--yellow);font-family:'Barlow Condensed',sans-serif;font-weight:700}
.tbl td.gain{color:var(--green);font-weight:700}
.tbl td.loss{color:var(--red);font-weight:700}
.wsw{background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--yellow);padding:18px 22px;margin-top:18px;border-radius:4px}
.wsw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.wsw-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.18em;color:var(--yellow);font-weight:700;margin-bottom:8px}
.wsw-text{font-size:13px;color:var(--text);line-height:1.55}
.note{font-size:11px;color:var(--grey);margin-top:8px;font-style:italic}
.method{margin-top:32px;padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:4px}
.method-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--yellow);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.method ul{font-size:12px;color:var(--grey-2);line-height:1.6;margin-top:4px;padding-left:18px}

.stale-banner{background:linear-gradient(90deg,rgba(248,113,113,0.08),rgba(248,113,113,0.02));border:1px solid rgba(248,113,113,0.3);border-left:3px solid var(--red);border-radius:4px;padding:14px 18px;margin-bottom:18px;display:flex;align-items:center;gap:14px}

.stale-banner-text{font-family:'Barlow',sans-serif;font-size:12px;color:var(--text);line-height:1.5}
.stale-banner-text strong{color:#fff}
@media print{
  body,html{background:#fff;color:#000}.container{padding:12px}.tabs{display:none}.tab-content{display:block !important;page-break-after:always}
}

const YELLOW='#FFE000', GREEN='#4ade80', RED='#f87171', BLUE='#60a5fa', PINK='#f472b6', GREY='#71717a', GREY2='#52525b', BORDER='#262626';
const fmtUSD=(v,dp=0)=>'$'+(v??0).toLocaleString('en-US',{maximumFractionDigits:dp,minimumFractionDigits:dp});
const fmtUSDk=v=>v>=1000000?'$'+(v/1000000).toFixed(2)+'M':'$'+(v/1000).toFixed(0)+'k';
const fmtNum=v=>(v??0).toLocaleString('en-US');
const pctDelta=(a,b)=>b===0?null:((a-b)/b*100);
function deltaHTML(value, suffix='%', invert=false) {
  if (value===null || value===undefined || isNaN(value)) return '<span class="delta neutral">·</span>';
  const positive=value>=0;
  const isGood=invert?!positive:positive;
  const cls=isGood?'up':'down';
  return `<span class="delta ${cls}">${positive?'▲':'▼'} ${Math.abs(value).toFixed(1)}${suffix}</span>`;
}
function deltaPtsHTML(value, invert=false) {
  if (value===null || value===undefined || isNaN(value)) return '<span class="delta neutral">·</span>';
  const positive=value>=0;
  const isGood=invert?!positive:positive;
  return `<span class="delta ${isGood?'up':'down'}">${positive?'▲':'▼'} ${Math.abs(value).toFixed(2)} pts</span>`;
}
function kpiCard(label, value, lwValue, pwValue, pyValue, opts={}) {
  const {prefix='', suffix='', dp=0, invert=false} = opts;
  const wow = pctDelta(lwValue, pwValue);
  const yoy = pyValue!==undefined && pyValue!==null ? pctDelta(lwValue, pyValue) : null;
  const valueStr = typeof value==='number' ? value.toLocaleString('en-US',{maximumFractionDigits:dp, minimumFractionDigits:dp}) : value;
  return `<div class="kpi-card">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${prefix}${valueStr}${suffix}</div>
    <div class="kpi-deltas">
      <div><span class="delta-label">WoW</span>${deltaHTML(wow, '%', invert)}</div>
      ${yoy!==null?`<div><span class="delta-label">YoY</span>${deltaHTML(yoy, '%', invert)}</div>`:''}
    </div>
  </div>`;
}
function sectionHeader(num, title, sub) {
  return `<div class="section-header"><div class="section-header-row"><div class="section-num">${num}</div><h2 class="section-title">${title}</h2></div>${sub?`<div class="section-sub">${sub}</div>`:''}</div>`;
}
function wswBlock(what, soWhat, whatNext) {
  return `<div class="wsw"><div class="wsw-grid">
    <div><div class="wsw-label">WHAT</div><div class="wsw-text">${what}</div></div>
    <div><div class="wsw-label">SO WHAT</div><div class="wsw-text">${soWhat}</div></div>
    <div><div class="wsw-label">WHAT'S NEXT</div><div class="wsw-text">${whatNext}</div></div>
  </div></div>`;
}

  let html = '';
  html += sectionHeader('01', 'Headline KPIs · Last Week', 'Jul 26 – Aug 1, 2026 (Sun–Sat). Sales shown as Net Sales. AOV = Shopify reported field (orders-weighted). YoY comparisons available. Marketing spend restored this week, so MER, aMER and CAC carry a genuine WoW comparison for the first time since W24.');
  html += `<div class="kpi-grid">

  html += sectionHeader('02', 'YTD Performance', 'Jan 1 – Apr 25, 2026 vs prior year');
  html += `<div class="kpi-grid">
    ${kpiCard('YTD Net Sales', YTD.net_sales, YTD.net_sales, YTD_PY?.net_sales ?? null, null, {prefix:'$'})}
    ${kpiCard('YTD Orders', YTD.orders, YTD.orders, YTD_PY?.orders ?? null, null)}
    ${kpiCard('YTD Sessions', YTD.sessions, YTD.sessions, YTD_PY?.sessions ?? null, null)}
    ${kpiCard('YTD AOV (Shopify)', YTD.aov, YTD.aov, YTD_PY?.aov ?? null, null, {prefix:'$', dp:2})}
    ${kpiCard('YTD CVR', YTD.cvr, YTD.cvr, YTD_PY?.cvr ?? null, null, {suffix:'%', dp:2})}

  html += `<div class="stack">
    <div class="panel"><div class="panel-title">Net Sales · Current Year vs Prior Year (Weekly)</div>
      <div class="chart-wrap h-320"><canvas id="chartSales"></canvas></div></div>

  html += sectionHeader('04', 'Last Week vs Prior Week · Daily', 'Day-by-day comparison');
  html += `<div class="grid-2">
    <div class="panel"><div class="panel-title">Daily Net Sales (LW vs PW)</div><div class="chart-wrap h-260"><canvas id="chartDailySales"></canvas></div></div>
    <div class="panel"><div class="panel-title">Daily Orders (LW vs PW)</div><div class="chart-wrap h-260"><canvas id="chartDailyOrders"></canvas></div></div>
  </div>`;

  html += wswBlock(
    `Net Sales $1.08M in W26, down 6.8% WoW and up 11.3% YoY. Sessions 542,277 (-4.8% WoW, +20.9% YoY). CVR 1.44%, the lowest week of FY27 to date and the ninth consecutive week under 1.7%. Add to cart rate 7.86%, also an FY27 low. AOV $151.82 (+2.4% WoW). New customer share 51.4% on the Shopify customer basis, 50.2% on the order basis. Adjusted net sales $1.24M, 11.1% below Canadian budget for a second consecutive week.`,
    `Revenue is holding up better than volume because AOV and margin are carrying the week. Orders, units and add to cart rate all fell harder than net sales. That is a demand quality problem rather than a pricing problem, and it is why the gap to Canadian budget widened even though YoY growth is still positive at +11.3%. The one genuine positive is efficiency: spend fell 21.0% while sales fell 6.8%, lifting MER from 12.94x to 15.28x.`,
    `(1) Take the two week budget miss to Jason framed as an order volume gap, not a revenue gap. (2) Decompose the add to cart decline by landing page type and traffic source across W24 to W26. (3) Decide whether the MER improvement is a deliberate hold or an underspend, because at 15.28x there is now headroom under the 16x floor to buy volume back.`

  const funnel = [
    {stage:'Sessions', LW: LW.sessions, PW: PW.sessions},
    {stage:'Add to Cart', LW: LW.cart_adds, PW: PW.cart_adds},
    {stage:'Completed Checkout', LW: LW.completed, PW: PW.completed},
    {stage:'Orders', LW: LW.orders, PW: PW.orders},
  ];
  let funnelHTML = '<div class="panel"><div class="panel-title">Funnel Volume · Last Week vs Prior Week</div><div class="funnel-row">';
  funnel.forEach((s, i) => {
    const wow = pctDelta(s.LW, s.PW);
    const dropLW = i===0 ? 0 : (1 - s.LW / funnel[i-1].LW) * 100;
    const dropPW = i===0 ? 0 : (1 - s.PW / funnel[i-1].PW) * 100;
    funnelHTML += `<div class="funnel-card">
      <div class="funnel-card-label">${s.stage}</div>
      <div class="funnel-card-val">${fmtNum(s.LW)}</div>
      <div class="funnel-card-sub">PW: ${fmtNum(s.PW)} · ${deltaHTML(wow)}</div>
      ${i>0?`<div class="dropoff">
        <div class="dropoff-label">DROP-OFF FROM PREV STAGE</div>
        <div class="dropoff-val">${dropLW.toFixed(1)}%</div>
        <div class="dropoff-sub">PW: ${dropPW.toFixed(1)}% ${deltaPtsHTML(dropLW - dropPW, true)}</div>
      </div>`:''}
    </div>`;
  });
  funnelHTML += '</div></div>';
  html += `<div class="stack">${funnelHTML}
    <div class="panel"><div class="panel-title">Conversion Funnel Rates · YTD Weekly Trend</div><div class="chart-wrap h-300"><canvas id="chartFunnelRates"></canvas></div></div>
    <div class="panel"><div class="panel-title">Daily CVR · Last Week vs Prior Week</div><div class="chart-wrap h-240"><canvas id="chartDailyCVR"></canvas></div></div>
  </div>`;

  html += wswBlock(
    `CVR 1.44% in W26, down 0.09pts WoW and 0.18pts YoY, the lowest week of FY27. Add to cart rate 7.86%, down 0.51pts WoW and also an FY27 low. Cart to complete 18.29%, marginally up from 18.22%. No day in W26 reached 1.55% CVR. Blended PDP CVR 1.21%.`,
    `The entire funnel loss sits before the cart. Checkout completion improved slightly, so this is not a payment, shipping or checkout defect. Sessions are up 20.9% YoY while CVR is down 0.18pts, which means we are adding traffic faster than we are adding qualified demand. Cart to complete is still roughly 4pts below the W11 to W17 baseline, so there are two separate problems stacked: a worsening top of funnel and an unrecovered middle.`,
    `(1) Run the add to cart decomposition by landing page type and traffic source for W24 to W26 and return with one recommended intervention, not a list. (2) Check size and stock availability on the highest session product pages, since nine pages carried 22,242 sessions at under 0.8% CVR. (3) Keep cart to complete on the weekly watch list until it clears 20%.`
  );
  return html;
}

function renderChannelTable() {
  const filter = document.getElementById('channel-filter').value;
  const sortBy = document.getElementById('channel-sort').value;
  let channels = [...DATA.channels_lw_pw];
  const groups = {
    'paid': ['Google Paid','Meta Paid','Pinterest Paid'],
    'organic': ['Google Organic','Meta Organic','Pinterest Organic','Other Search','AI Search'],
    'email_sms': ['Email (Klaviyo)','SMS (Attentive)'],
    'social': ['Meta Paid','Meta Organic','Pinterest Paid','Pinterest Organic','TikTok','Reddit','YouTube'],
    'search': ['Google Paid','Google Organic','Google Other','Other Search','AI Search'],
    'affiliate_bnpl': ['Affiliate/Coupon','BNPL Apps'],
  };
  if (filter !== 'all') {
    const include = groups[filter] || [];
    channels = channels.filter(c => include.includes(c.channel));

  let tbl = '<div class="panel"><div style="overflow-x:auto"><table class="tbl"><thead><tr>';

  channels.forEach(c => {
    tbl += `<tr>

  tbl += '</tbody></table></div></div>';

function addChannelToTrend(channelName) {
  if (!channelName) return;
  if (!chartInstances.channelTrend) return;
  const chart = chartInstances.channelTrend;
  const existing = chart.data.datasets.find(d => d.label === channelName);
  if (existing) { document.getElementById('trend-channel-add').value = ''; return; }
  const data = DATA.weekly_all_ch[channelName] || [];
  if (data.length === 0) return;
  const colors = ['#fbbf24','#60a5fa','#a78bfa','#34d399','#f87171','#f472b6','#22d3ee','#fb923c','#e879f9','#84cc16'];
  const color = colors[chart.data.datasets.length % colors.length];
  chart.data.datasets.push({
    label: channelName, data: data.map(d => d.sales),
    borderColor: color, backgroundColor: color,
    tension: 0.2, pointRadius: 3, borderWidth: 2,
  });
  chart.update();
  document.getElementById('trend-channel-add').value = '';
}

function resetChannelTrend() {
  if (!chartInstances.channelTrend) return;
  const chart = chartInstances.channelTrend;
  const topN = DATA.top8_channels.slice(0, 5);
  const colors = [YELLOW,'#60a5fa','#a78bfa','#34d399','#f87171'];
  chart.data.datasets = topN.map((ch, i) => ({
    label: ch, data: (DATA.weekly_channels[ch] || []).map(d => d.sales),
    borderColor: colors[i], backgroundColor: colors[i],
    tension: 0.2, pointRadius: 3, borderWidth: 2,
  }));
  chart.update();
}

function buildDiscounts() {

  const pre = discounts.slice(0, 10);
  const post = discounts.slice(10);
  const preAvg = pre.reduce((s,d) => s + d.disc_order_rate, 0) / pre.length;
  const postAvg = post.reduce((s,d) => s + d.disc_order_rate, 0) / post.length;

  html += sectionHeader('01', 'Discount Performance · W26 (Jul 26 – Aug 1)', 'Note: Discount file orders ≠ Shopify eCom orders (different scope/aggregation). Use rates directionally.');
  html += `<div class="kpi-grid" style="margin-bottom:24px">

  html += wswBlock(
    `Nike $388K (-9.6% WoW) still 36.0% of product revenue. adidas $154K (+7.8%), carried almost entirely by the PW Adistar Jellyfish launch at $21.3K and the Chinese New Year Tang Jacket run. Jordan $125K (-16.9%), the largest single brand drag. New Balance $128K (-3.7%). Salomon $14.2K (+92.9%) from a small base at 49.7% gross margin. Top ten product concentration rose to 10.9% from 9.4%.`,
    `The week was carried by launches while the core range softened. Two products that did not exist in W25 contributed $30.7K. Rising concentration on launch product with a declining base makes weekly revenue more volatile and harder to forecast into Peak, and it compounds the falling new customer share because launches historically over-index on new customers. Jordan 5 Retro Black / University Blue went net negative at -$840 after $14.7K in W25, which is a post-launch returns wave worth understanding before the next drop.`,
    `(1) Pull the returns detail on Jordan 5 Retro Black / University Blue and confirm the driver before the next Jordan launch. (2) Cross reference the W26 decliners against the pricing dashboard to separate market price position from post-launch decay. (3) Map the W27 to W30 launch calendar against the budget gap so we know how much of the shortfall product is expected to close.`
  );

  html += `<div class="method">
    <div class="method-title">Methodology Notes</div>
    <ul>
      <li><strong>Sales</strong> = Net Sales (Shopify field), used for headline and all comparisons throughout.</li>
      <li><strong>AOV</strong> = Shopify reported "Average order value" field, orders-weighted across the period (online-store basis). LW $149.75, +4.0% YoY, +0.8% WoW.</li>

      <li>Discount file totals (orders) differ from eCom KPI orders due to scope/aggregation differences; rates used directionally only.</li>

      <li>Bot activity targeting Jordan GS sizing remains an active background factor in checkout abandonment metrics.</li>
    </ul>
  </div>`;

  return html;
}

    <div class="panel"><div class="panel-title">Discount Usage % of Orders · Weekly</div><div class="chart-wrap h-280"><canvas id="chartDiscUsage"></canvas></div></div>
    <div class="panel"><div class="panel-title">Conversion Rate · Sessions · Weekly</div><div class="chart-wrap h-300"><canvas id="chartCvrSess"></canvas></div></div>
    <div class="panel"><div class="panel-title">Category Mix · Weekly Net Sales</div><div class="chart-wrap h-320"><canvas id="chartCatMix"></canvas></div></div>
  </div>`;

  // === SECTION 4 · Cumulative tracking ===
  html += sectionHeader('04', 'Cumulative Tracking · Net Sales vs Budget', 'Running total against running budget');
  html += `<div class="stack">
    <div class="panel"><div class="panel-title">Cumulative Net Sales vs Cumulative Budget · Weekly</div><div class="chart-wrap h-320"><canvas id="chartCumulative"></canvas></div></div>
    <div class="panel"><div class="panel-title">Weekly Variance vs Budget %</div><div class="chart-wrap h-280"><canvas id="chartVarPct"></canvas></div></div>
  </div>`;

  // === SECTION 5 · Forecast ===
  html += sectionHeader('05', 'Run Rate & W27 Forecast', 'Rank-weighted forecast vs W27 budget proxy (trailing 4-week average)');

  const w18_gap = T.forecasted_run_rate - T.next_week_budget; // W13 budget CA from forecast sheet
  const w18_gap_pct = w18_gap / T.next_week_budget * 100;
  html += `<div class="grid-3">
    <div class="compare-box now"><div class="compare-label">MTD (Last 4 Weeks)</div><div class="compare-value yellow">${fmtUSDk(T.mtd_total.net_sales)}</div><div class="compare-sub">vs ${fmtUSDk(T.mtd_total.budget)} budget · +${T.mtd_total.var_pct.toFixed(1)}% above</div></div>
    <div class="compare-box pre"><div class="compare-label">W13 Forecast (Run Rate)</div><div class="compare-value">${fmtUSDk(T.forecasted_run_rate)}</div><div class="compare-sub">Rank-weighted from W6–W25</div></div>
    <div class="compare-box ${w18_gap >= 0 ? 'now' : 'post'}"><div class="compare-label">W27 vs Budget Gap</div><div class="compare-value">${w18_gap >= 0 ? '+' : ''}${fmtUSDk(w18_gap)}</div><div class="compare-sub">${w18_gap_pct >= 0 ? '+' : ''}${w18_gap_pct.toFixed(1)}% vs W27 budget proxy ${fmtUSDk(T.next_week_budget)}</div></div>
  </div>`;

  // === SECTION 5 · Region breakdown ===
  html += sectionHeader('06', 'Regional Performance · W26', 'Sessions · Conversion · AOV · Net Sales by region · WoW and YoY');

  let regTbl = '<div class="panel"><div class="panel-title">Regions · W26 vs W25 vs Prior Year</div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Region</th><th class="r">Net Sales LW</th><th class="r">WoW</th><th class="r">YoY</th><th class="r">Sessions LW</th><th class="r">Sess WoW</th><th class="r">Sess YoY</th><th class="r">CVR LW</th><th class="r">CVR YoY</th><th class="r">AOV LW</th><th class="r">AOV YoY</th></tr></thead><tbody>';
  T.regions.forEach(r => {
    regTbl += `<tr>
      <td class="strong">${r.region}</td>
      <td class="r strong">${fmtUSDk(r.net_sales_lw)}</td>
      <td class="r">${deltaHTML(r.net_sales_wow)}</td>
      <td class="r">${deltaHTML(r.net_sales_yoy)}</td>
      <td class="r muted">${fmtNum(r.sessions_lw)}</td>
      <td class="r">${deltaHTML(r.sessions_wow)}</td>
      <td class="r">${deltaHTML(r.sessions_yoy)}</td>
      <td class="r">${r.cvr_lw.toFixed(2)}%</td>
      <td class="r">${deltaHTML(r.cvr_yoy)}</td>
      <td class="r muted">${fmtUSD(r.aov_lw,2)}</td>
      <td class="r">${deltaHTML(r.aov_yoy)}</td>
    </tr>`;
  });
  regTbl += '</tbody></table></div></div>';
  html += regTbl;

  html += `<div class="grid-2" style="margin-top:16px">
    <div class="panel"><div class="panel-title">Net Sales by Region · W26 vs W25</div><div class="chart-wrap h-280"><canvas id="chartRegSales"></canvas></div></div>
    <div class="panel"><div class="panel-title">Net Sales YoY by Region</div><div class="chart-wrap h-280"><canvas id="chartRegYoY"></canvas></div></div>
  </div>`;

  html += `<div class="panel" style="margin-top:16px"><div class="panel-title">Category Mix by Region · W26</div><div class="chart-wrap h-280"><canvas id="chartRegCat"></canvas></div></div>`;

  // === SECTION 07 · Province detail ===
  html += sectionHeader('07', 'Province Detail · W26', 'Sessions and CVR by province, vs Prior Year');

  let provTbl = '<div class="panel"><div class="panel-title">Provinces · W26 (sorted by Net Sales)</div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Region</th><th>Province</th><th class="r">Net Sales</th><th class="r">Orders</th><th class="r">AOV</th><th class="r">AOV PY</th><th class="r">Gross Sales</th><th class="r">Discounts</th></tr></thead><tbody>';
  [...T.province_sales].sort((a,b)=>b.net_sales-a.net_sales).forEach(p => {
    const aov_d = p.aov_py > 0 ? ((p.aov - p.aov_py)/p.aov_py*100) : null;
    provTbl += `<tr>
      <td style="font-size:11px"><span style="color:#a1a1aa">${p.region}</span></td>
      <td class="strong">${p.province}</td>
      <td class="r strong">${fmtUSD(p.net_sales)}</td>
      <td class="r muted">${fmtNum(p.orders)}</td>
      <td class="r">${fmtUSD(p.aov,2)}</td>
      <td class="r muted">${p.aov_py > 0 ? fmtUSD(p.aov_py,2) : '·'}</td>
      <td class="r muted">${fmtUSD(p.gross_sales)}</td>
      <td class="r muted">${fmtUSD(Math.abs(p.discounts))}</td>
    </tr>`;
  });
  provTbl += '</tbody></table></div></div>';
  html += provTbl;

  html += `<div class="panel" style="margin-top:16px"><div class="panel-title">Province CVR · W26 vs PY (Sessions ≥ 1k)</div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Province</th><th class="r">Sessions LW</th><th class="r">Sess YoY</th><th class="r">CVR LW</th><th class="r">CVR PY</th><th class="r">CVR YoY</th></tr></thead><tbody>`;
  T.provinces.filter(p => p.sessions_lw >= 1000).forEach(p => {
    html += `<tr>
      <td class="strong">${p.province}</td>
      <td class="r strong">${fmtNum(p.sessions_lw)}</td>
      <td class="r">${deltaHTML(p.sessions_yoy)}</td>
      <td class="r">${p.cvr_lw.toFixed(2)}%</td>
      <td class="r muted">${p.cvr_py.toFixed(2)}%</td>
      <td class="r">${deltaHTML(p.cvr_yoy)}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';

  // === WSW Block ===
  html += wswBlock(
    `Adjusted Net Sales $1.24M in W26, 11.1% below Canadian budget and the widest gap in twelve weeks, following -9.8% in W25. Against UK budget still +15.3%, but that cushion has halved from +48.1% in W22. Footwear -8.0% vs budget, Apparel -15.8%, Accessories -42.5%. Margin 37.4%, up from 35.5%. Full price share 36.2% against a 41.8% target. Discount usage 15.5%. MTD across W23 to W26 is $5.40M against $5.63M budget, -4.0%.`,
    `Two consecutive weeks below plan has turned a single soft week into a trend, and the month to date position is now negative. The miss is broad rather than isolated: every category is below budget, and accessories is materially so. Margin and full price share are both improving, so the shortfall is volume, not rate. The UK budget comparison will stop being a comfort within two or three weeks at the current rate of erosion.`,
    `(1) Urgent conversation with Jason on the W27 to W30 recovery path, quantified as an order requirement rather than a revenue requirement. (2) Review the accessories plan, since -42.5% against budget suggests a ranging or availability issue rather than demand. (3) Confirm whether the margin recovery is sustainable before it is assumed in the back half plan.`
  );

  return html;
}

  // === View A · High-traffic, low-CVR PDPs ===

    zombieTbl += `<tr>
      <td style="font-size:11px"><div class="strong">${z.title}</div><div class="muted" style="font-size:10px">${z.lp_path}</div></td>

      launchTbl += `<tr>
        <td style="font-size:11px"><div class="strong">${l.title}</div><div class="muted" style="font-size:10px">${l.lp_path}</div></td>

      <td style="font-size:11px"><div class="strong">${t.title}</div><div class="muted" style="font-size:10px">${t.lp_path}</div></td>

    </tr>`;
  });
  tsTbl += '</tbody></table></div></div>';
  html += tsTbl;

  html += wswBlock(
    `LP export arrived in stripped format again, so counts are reconstructed from rates and landing page type is inferred from URL patterns. Landing page sessions 288,380 (-10.3% WoW) with completions down 13.3%. Blended PDP CVR 1.21%. PDP match rate 96.7% of W26 sales, up from 93.4%. Nine zombie pages carry 22,242 sessions at under 0.8% CVR, representing roughly 162 lost completions and about $24.6K of revenue opportunity at current AOV.`,
    `The landing page picture confirms the funnel finding from a different angle. Sessions fell faster on landing pages than sitewide, and completions fell faster still, so the pages receiving traffic are converting worse rather than simply receiving less. The zombie list is concentrated in specific colourways rather than spread across the catalogue, which points to size or stock availability rather than a template problem.`,
    `(1) Check size and stock depth on the nine zombie pages before treating this as a merchandising or content issue. (2) Confirm whether the stripped LP export format can be reverted at source, since reconstructing counts adds a rounding tolerance every week. (3) Compare collection page CVR of 1.52% against product page CVR of 1.19% when prioritising the next collection builds.`
  );

  return html;
}

      <div style="color:var(--muted);font-size:14px;max-width:600px;margin:0 auto">${SPEND.note}</div>
    </div>`;
    h += wswBlock(
    `Ad spend $70,764 in W26, down 21.0% from $89,613 in W25. MER 15.28x from 12.94x. aMER 7.12x from 6.01x. Blended new customer CAC $15.29 from $17.36. Spend as a share of sales 6.55% from 7.73%. New customer orders 4,627, down 10.3%. Gross media was $74,675 across Google $65,609 and paid social $9,066; co-op $1,999 and new store opening video $1,913 are excluded, which reconciles to the marketing summary within $1.`,

  );

  return html;
}

function buildCvrDiagnostic() {
  const C = CVR_DIAG;
  const w22 = C.weekly[C.weekly.length-1];
  const w21 = C.weekly[C.weekly.length-2];
  const w17 = C.weekly[16] || w22;

  let html = sectionHeader('01', 'CVR Diagnostic · W26 Persistent Site-Wide Issue (9 weeks)', 'FY27 weekly trend, YoY comparison, day-of-week decomposition, funnel breakdown, W26 daily.');

  html += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">W22 CVR</div>
      <div class="kpi-value">${w22.cvr.toFixed(2)}%</div>
      <div class="kpi-deltas"><div><span class="delta-label">WoW</span>${deltaPtsHTML(w22.cvr-w21.cvr)}</div><div><span class="delta-label">YoY</span>${deltaPtsHTML(w22.cvr_yoy)}</div></div>
      <div class="kpi-target">W17 peak: ${w17.cvr.toFixed(2)}% · target 1.75%+</div>
    </div>
    <div class="kpi-card"><div class="kpi-label">Baseline avg (W11-W17)</div>
      <div class="kpi-value">${C.baseline_avg_cvr.toFixed(2)}%</div>
      <div class="kpi-deltas"><div><span class="delta-label" style="color:var(--muted)">7-week healthy period</span></div></div>
      <div class="kpi-target">All 7 weeks ≥ 1.72%</div>
    </div>
    <div class="kpi-card"><div class="kpi-label">Break avg (W18-W22)</div>
      <div class="kpi-value" style="color:var(--red)">${C.break_avg_cvr.toFixed(2)}%</div>
      <div class="kpi-deltas"><div><span class="delta-label">vs Baseline</span>${deltaPtsHTML(C.break_avg_cvr-C.baseline_avg_cvr)}</div></div>
      <div class="kpi-target">4 of 5 weeks under 1.7%</div>
    </div>
    <div class="kpi-card"><div class="kpi-label">W22 Cart→Comp</div>
      <div class="kpi-value">${w22.compatc.toFixed(2)}%</div>
      <div class="kpi-deltas"><div><span class="delta-label" style="color:var(--muted)">Was 19.33% at W20</span></div></div>
      <div class="kpi-target">Post-ATC funnel leak</div>
    </div>
  </div>`;

  html += sectionHeader('02', 'FY27 Weekly CVR Trend · LW vs PY', 'CVR by fiscal week Feb 1 to Aug 1. Dashed line shows PY comparison. Red threshold line at 1.70%.');
  html += '<div class="chart-wrap"><h3>Weekly CVR vs Prior Year</h3><div class="chart-container"><canvas id="cvrTrendChart"></canvas></div></div>';

  html += sectionHeader('03', 'Funnel Decomposition · ATC vs Cart→Complete', 'Dual axis: ATC% (left) and Cart→Comp% (right). Break period is post-ATC funnel leak, not top-of-funnel.');
  html += '<div class="chart-wrap"><h3>ATC rate and Cart→Completion rate weekly</h3><div class="chart-container"><canvas id="funnelDecompChart"></canvas></div></div>';

  html += sectionHeader('04', 'Day-of-Week: Baseline vs Break Period', 'CVR by day of week. Baseline W11-W17 vs Break W18-W26. Thursday and Saturday remain hit hardest.');
  html += '<div class="panel"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">';
  C.dow_baseline_vs_break.forEach(d => {
    const sev = d.delta < -.2 ? 'severe' : d.delta < -.1 ? 'moderate' : 'mild';
    const border = sev==='severe' ? '2px solid var(--red)' : sev==='moderate' ? '2px solid var(--amber)' : '1px solid var(--border)';
    const deltaColor = d.delta < 0 ? 'var(--red)' : 'var(--green)';
    html += `<div style="background:var(--panel2);border:${border};border-radius:6px;padding:12px;text-align:center">
      <div style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:600">${d.day}</div>
      <div style="font-size:22px;font-weight:700;margin:6px 0;color:${deltaColor}">${d.delta>=0?'+':''}${d.delta.toFixed(2)}pts</div>
      <div style="font-size:11px;color:var(--muted)">${d.baseline.toFixed(2)}% → ${d.break.toFixed(2)}%</div>
    </div>`;
  });
  html += `</div><div style="color:var(--muted);font-size:12px;margin-top:12px">Baseline: ${C.baseline_period}. Break: ${C.break_period}. Thursday (-0.31pts) and Saturday (-0.24pts) are the epicenters.</div></div>`;

  html += sectionHeader('05', 'W26 Daily Detail', 'Per-day CVR, ATC%, and Cart→Comp%. No day in W26 reached 1.55%. Friday 31 July was the weakest at 1.36%.');
  html += '<div class="panel"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Day</th><th class="r">Sessions</th><th class="r">Orders</th><th class="r">Net Sales</th><th class="r">CVR</th><th class="r">ATC %</th><th class="r">Cart→Comp</th></tr></thead><tbody>';
  C.w22_daily.forEach(d => {
    const cvrCls = d.cvr >= 1.7 ? 'delta-pos' : 'delta-neg';
    const marker = d.cvr >= 1.7 ? ' ✓' : ' ⚠';
    html += `<tr><td class="strong">${d.day}</td><td class="r">${fmtNum(d.sess)}</td><td class="r">${fmtNum(d.orders)}</td><td class="r strong">${fmtUSD(d.ns)}</td><td class="r strong ${cvrCls}">${d.cvr.toFixed(2)}%${marker}</td><td class="r muted">${d.atcr.toFixed(2)}%</td><td class="r muted">${d.compatc.toFixed(2)}%</td></tr>`;
  });
  html += '</tbody></table></div></div>';

  html += wswBlock(
    `CVR 1.44% in W26, down 0.18pts YoY and the lowest week of FY27. The break period W18 to W26 now runs nine consecutive weeks, longer than the seven week W11 to W17 baseline it broke from. Baseline average 1.75% against break average 1.57%, a 0.18pt persistent gap. Thursday remains the worst day of week at -0.31pts against baseline, with Saturday second at -0.27pts. No day in W26 reached 1.55%.`,
    `This is now definitively structural rather than tactical. Nine weeks is long enough to rule out promotional timing, seasonality or a single bad trading week. The new information in W26 is that add to cart rate also hit an FY27 low of 7.86%, which shifts the diagnosis: for most of the break period the problem was cart to complete, and it has now been joined by a top of funnel problem. Two failure points compounding explains why CVR reached a new low even as checkout completion held.`,
    `(1) Separate the two problems explicitly in the next review: add to cart is a traffic quality, availability and merchandising question; cart to complete is a checkout question. (2) Prioritise the add to cart decomposition first, since it is the newer and faster moving of the two. (3) If cart to complete recovered to the 22% baseline at current traffic, CVR would return to roughly 1.73%, which is the size of the prize worth quantifying for Jason.`
  );

  return html;
}

function buildCampaigns() {
  let html = '';

  // === Section 01 · Campaign topline ===

  const ordersYoYPct = tot.orders_py > 0 ? ((tot.orders_lc - tot.orders_py)/tot.orders_py*100) : null;
  const sessYoYPct = tot.sessions_py > 0 ? ((tot.sessions - tot.sessions_py)/tot.sessions_py*100) : null;

  html += sectionHeader('01', 'Campaigns & Attribution · W26 (Jul 26 – Aug 1)', 'First-click attribution. WoW vs W25 and YoY vs same week 2025. ' + tot.campaigns_with_sales + ' campaigns produced revenue from ' + tot.campaigns_active + ' active.');

  html += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">First-Click Sales</div>
      <div class="kpi-value">${fmtUSDk(tot.sales_lc)}</div>
      <div class="kpi-deltas">
        <div><span class="delta-label">YoY</span>${deltaHTML(salesYoYPct)}</div>
      </div>
      <div class="kpi-target">PY: ${fmtUSDk(tot.sales_py)}</div>
    </div>
    <div class="kpi-card"><div class="kpi-label">Orders (First-Click)</div>
      <div class="kpi-value">${fmtNum(tot.orders_lc)}</div>
      <div class="kpi-deltas">
        <div><span class="delta-label">YoY</span>${deltaHTML(ordersYoYPct)}</div>
      </div>
      <div class="kpi-target">PY: ${fmtNum(tot.orders_py)}</div>
    </div>
    <div class="kpi-card"><div class="kpi-label">Total Sessions</div>
      <div class="kpi-value">${fmtNum(tot.sessions)}</div>
      <div class="kpi-deltas">
        <div><span class="delta-label">YoY</span>${deltaHTML(sessYoYPct)}</div>
      </div>
      <div class="kpi-target">PY: ${fmtNum(tot.sessions_py)}</div>
    </div>
    <div class="kpi-card"><div class="kpi-label">Campaigns Active</div>
      <div class="kpi-value">${fmtNum(tot.campaigns_active)}</div>
      <div class="kpi-deltas">
        <div><span class="delta-label">With Sales</span><span class="delta neutral">${fmtNum(tot.campaigns_with_sales)}</span></div>
      </div>
      <div class="kpi-target">Activation ${(tot.campaigns_with_sales/tot.campaigns_active*100).toFixed(1)}%</div>
    </div>

  // === Section 02 · Campaign Types ===
  html += sectionHeader('02', 'Performance by Campaign Type', 'First-click sales with WoW + YoY. CVR uses first-click orders / sessions.');

  let typeTbl = '<div class="panel"><div style="overflow-x:auto"><table class="tbl"><thead><tr>';
  typeTbl += '<th>Campaign Type</th><th class="r">Sales LW</th><th class="r">Share</th><th class="r">WoW</th><th class="r">YoY</th><th class="r">Sessions</th><th class="r">Orders</th><th class="r">CVR</th><th class="r">Campaigns</th>';
  typeTbl += '</tr></thead><tbody>';
  CAMP.types.forEach(t => {
    typeTbl += `<tr>
      <td class="strong">${t.type}</td>
      <td class="r strong">${fmtUSD(t.sales_lc)}</td>
      <td class="r muted">${t.share.toFixed(1)}%</td>
      <td class="r">${deltaHTML(t.sales_wow)}</td>
      <td class="r">${deltaHTML(t.sales_yoy)}</td>
      <td class="r muted">${fmtNum(t.sessions)}</td>
      <td class="r muted">${fmtNum(t.orders)}</td>
      <td class="r">${t.cvr.toFixed(2)}%</td>
      <td class="r muted">${t.campaigns}</td>
    </tr>`;
  });
  typeTbl += '</tbody></table></div></div>';
  html += typeTbl;

  // === Section 03 · Campaign Type Weekly Trend ===
  html += sectionHeader('03', 'Campaign Type Weekly Trend', 'First-click sales by type across FY27');
  html += `<div class="panel"><div class="chart-wrap h-300"><canvas id="chartCampType"></canvas></div></div>`;

  // === Section 04 · WoW Gainers / Decliners ===
  html += sectionHeader('04', 'WoW Movers · Top Gainers and Decliners', 'Biggest WoW change in first-click sales (sessions ≥100)');

  let gainersTbl = '<div class="panel"><div class="panel-title">Top 10 WoW Gainers</div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Campaign</th><th class="r">LW</th><th class="r">PW</th><th class="r">Δ$</th></tr></thead><tbody>';
  CAMP.wow_gainers.slice(0,10).forEach(g => {
    gainersTbl += `<tr>
      <td style="font-size:11px"><div class="strong">${g.campaign.substring(0,55)}</div><div class="muted" style="font-size:10px">${g.channel}</div></td>

  html += `<div class="panel" style="margin-bottom:8px"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <label for="camp-filter-ch" style="font-size:12px;color:#a1a1aa">Channel:</label>
    <select id="camp-filter-ch" style="background:#18181b;border:1px solid #3f3f46;color:#fafafa;padding:6px 10px;border-radius:4px;font-family:inherit;font-size:12px" onchange="renderCampaignTable()">
      <option value="all" selected>All channels</option>
      ${CAMP.channel_filter_options.map(c => `<option value="${c}">${c}</option>`).join('')}
    </select>

    <select id="camp-filter-type" style="background:#18181b;border:1px solid #3f3f46;color:#fafafa;padding:6px 10px;border-radius:4px;font-family:inherit;font-size:12px" onchange="renderCampaignTable()">

    </select>
    <label for="camp-sort" style="font-size:12px;color:#a1a1aa">Sort by:</label>
    <select id="camp-sort" style="background:#18181b;border:1px solid #3f3f46;color:#fafafa;padding:6px 10px;border-radius:4px;font-family:inherit;font-size:12px" onchange="renderCampaignTable()">
      <option value="sales_lc" selected>Sales LW</option>
      <option value="sales_wow">WoW %</option>

  // === Section 06 · Efficiency scatter ===
  html += sectionHeader('06', 'Campaign Efficiency Map', 'Sessions vs CVR by campaign. Top-right = best.');
  html += `<div class="panel"><div class="chart-wrap h-320"><canvas id="chartCampEff"></canvas></div></div>`;

  // === WSW ===
  const yoyTotal = salesYoYPct !== null ? salesYoYPct.toFixed(1) : 'n/a';
  html += wswBlock(
    `First-click campaign sales $1.22M in W26 from 95 campaigns with sales, out of 526 active. Shop and PMax $348.0K (56.4% share, -3.3% WoW). Branded Search $171.1K (27.7%, -9.0%). Sale and Promo $20.6K (-62.2%). Funnel campaigns $18.0K. Orders 9,213, sessions 542,266, both reconciling to the Shopify week.`,
    `Campaign revenue is concentrating into shopping and branded search, which together are 84.1% of tagged first-click sales. Branded search at 143.7x platform ROAS is largely harvesting existing demand rather than creating it, so the real acquisition work sits in shopping, PMax and the funnel campaigns, and those are the lines that softened. The 62.2% fall in sale and promo campaigns is consistent with the discount normalisation and is not a concern in itself.`,
    `(1) Separate branded search from the acquisition view in the next read so the harvesting effect does not flatter the blended picture. (2) Review PMax and shopping campaign pacing against the W27 to W30 budget gap. (3) Confirm the 431 active campaigns with no attributed sales are intentional and not spend leakage.`
  );

  return html;
}

function renderCampaignTable() {
  const chFilter = document.getElementById('camp-filter-ch').value;
  const typeFilter = document.getElementById('camp-filter-type').value;
  const sortBy = document.getElementById('camp-sort').value;
  let camps = [...CAMP.all_campaigns];
  if (chFilter !== 'all') camps = camps.filter(c => c.channel === chFilter);
  if (typeFilter !== 'all') camps = camps.filter(c => c.type === typeFilter);
  camps.sort((a,b) => {
    const va = a[sortBy] ?? -Infinity;
    const vb = b[sortBy] ?? -Infinity;
    return vb - va;
  });
  camps = camps.slice(0, 100);
  let tbl = '<div class="panel"><div style="overflow-x:auto"><table class="tbl"><thead><tr>';
  tbl += '<th>Campaign</th><th>Channel</th><th>Type</th><th class="r">Sales LW</th><th class="r">WoW</th><th class="r">YoY</th><th class="r">Sessions</th><th class="r">Orders</th><th class="r">CVR</th><th class="r">AOV</th>';
  tbl += '</tr></thead><tbody>';
  camps.forEach(c => {
    tbl += `<tr>
      <td style="font-size:11px" class="strong">${c.campaign.substring(0,60)}</td>
      <td style="font-size:11px" class="muted">${c.channel}</td>
      <td style="font-size:11px" class="muted">${c.type}</td>
      <td class="r strong">${fmtUSD(c.sales_lc)}</td>
      <td class="r">${deltaHTML(c.sales_wow)}</td>
      <td class="r">${deltaHTML(c.sales_yoy)}</td>
      <td class="r muted">${fmtNum(c.sessions)}</td>
      <td class="r muted">${fmtNum(c.orders_lc)}</td>
      <td class="r">${c.cvr.toFixed(2)}%</td>
      <td class="r muted">${c.aov ? fmtUSD(c.aov,2) : '·'}</td>
    </tr>`;
  });
  tbl += '</tbody></table></div></div>';
  document.getElementById('camp-table-container').innerHTML = tbl;
}

function renderCampaignCharts() {
  renderCampaignTable();

  // Campaign Type weekly trend
  const ct = document.getElementById('chartCampType');
  if (ct) {
    const types = CAMP.types.slice(0, 5).map(t => t.type);
    const colors = [YELLOW,'#60a5fa','#a78bfa','#34d399','#f87171'];
    // Get x-axis labels from any series
    const xLabels = CAMP.type_weekly[types[0]] ? CAMP.type_weekly[types[0]].map(d => d.week) : [];
    chartInstances.campType = new Chart(ct, {
      type: 'line',
      data: {
        labels: xLabels,
        datasets: types.map((t, i) => ({
          label: t,
          data: (CAMP.type_weekly[t] || []).map(d => d.sales),
          borderColor: colors[i], backgroundColor: colors[i],
          tension: 0.2, pointRadius: 3, borderWidth: 2, spanGaps: true,
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { x: { grid: gridConfig, ticks: tickConfig }, y: { grid: gridConfig, ticks: { ...tickConfig, callback: v => '$'+(v/1000).toFixed(0)+'k' } } },
        plugins: { legend: { position: 'top', labels: { color: '#fafafa' } }, tooltip: { callbacks: { label: ctx => ctx.dataset.label + ': ' + fmtUSD(ctx.raw) } } },
      },
    });
  }

  // Campaign Efficiency scatter
  const ce = document.getElementById('chartCampEff');
  if (ce) {
    const types = [...new Set(CAMP.efficiency_points.map(p => p.type))];
    const colors = [YELLOW,'#60a5fa','#a78bfa','#34d399','#f87171','#22d3ee','#f472b6','#fb923c','#e879f9'];
    const datasets = types.map((t, i) => ({
      label: t,
      data: CAMP.efficiency_points.filter(p => p.type === t).map(p => ({x: p.x, y: p.y, r: Math.min(20, Math.max(4, Math.sqrt(p.sales)/5))})),
      backgroundColor: colors[i % colors.length] + 'aa',
      borderColor: colors[i % colors.length],
    }));
    chartInstances.campEff = new Chart(ce, {
      type: 'bubble',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { type: 'logarithmic', title: { display: true, text: 'Sessions (log scale)', color: '#a1a1aa' }, grid: gridConfig, ticks: tickConfig },
          y: { title: { display: true, text: 'CVR %', color: '#a1a1aa' }, grid: gridConfig, ticks: { ...tickConfig, callback: v => v.toFixed(1) + '%' } }
        },
        plugins: { legend: { position: 'top', labels: { color: '#fafafa' } }, tooltip: { callbacks: { label: ctx => 'Sess: ' + fmtNum(ctx.raw.x) + ' · CVR: ' + ctx.raw.y.toFixed(2) + '%' } } },
      },
    });
  }
}


function activateTab(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.toggle('active', t.id==='tab-'+name));
  destroyCharts();
  if (name==='overview') renderOverviewCharts();
  else if (name==='funnel') renderFunnelCharts();
  else if (name==='channels') renderChannelCharts();
  else if (name==='campaigns') renderCampaignCharts();
  else if (name==='discounts') renderDiscountCharts();
  else if (name==='products') renderProductCharts();
  else if (name==='trade') renderTradeMeetingCharts();
  else if (name==='landing') renderLandingPagesCharts();
  else if (name==='margin') renderMarginCharts();
  else if (name==='cvrdiag') renderCvrDiagnosticCharts();
}
